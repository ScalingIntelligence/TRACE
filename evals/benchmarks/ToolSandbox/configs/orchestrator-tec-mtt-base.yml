# ToolSandbox orchestrator config: TEC + MTT + Base (3-way routing)
#
# Usage:
#   ORCHESTRATOR_CONFIG=configs/orchestrator-tec-mtt-base.yml \
#   VLLM_USER_URL=http://localhost:9001/v1 \
#   OPENAI_API_KEY=EMPTY \
#   tool_sandbox --agent Orchestrator --user VLLM \
#       --parallel 1 --output_dir data/Rout-TEC-MTT-v3

orchestrator:
  orchestrator_model: Qwen/Qwen3-30B-A3B-Instruct-2507
  orchestrator_llm_args:
    temperature: 0.0
    api_base: http://localhost:9001/v1
    api_key: EMPTY

  routing_strategy: per_conversation
  routing_mode: classifier
  routing_topk: 1
  classifier_temperature: 1.0
  routing_context_window: 10

  skills:
    - name: TEC
      description: >
        Choose TEC when the user message matches ANY of these patterns:
        - "Remind me to [X] tomorrow/next week [time]" (simple reminder with relative time, NO location mentioned)
        - "How many days till [holiday]" or "How far are we from [holiday]" (holiday countdown, wifi is NOT mentioned as broken)
        - "How far am I from [place]" (distance query using "how far am I")
        - "Which phone number [asked/sent/texted] me [content]" (searching messages by content)
        - "I can't access my [location/wifi/cellular]" or "help me fix [settings]" (implicit service recovery)
        - "Make [contacts] my [relationship]" (bulk relationship change)
        - "Who did I talk to last" followed by modification requests (multi-turn contact edit)
        - Requests that should be declined because required tools are unavailable
        TEC is the default choice when in doubt. Use TEC unless the message clearly matches MTT or base patterns.
      adapter_name: TEC-v3-iter10
      adapter_path: /home/ubuntu/hangook/games/tsb_lora/TEC-v3-10it-lora
      llm_args:
        api_base: http://localhost:8080/v1
        api_key: EMPTY

    - name: MTT
      description: >
        Choose MTT ONLY when the user message matches one of these specific patterns:
        - "What's the phone number of [business/place]" (looking up a phone number for a LOCATION, not a person)
        - "How many km to [place]" (distance in METRIC units specifically)
        - "I need a break" or frustrated tone + holiday question when wifi is off
        - "Update the phone number of the last person I [sent/talked to] to [number]" (single direct contact update with explicit new number)
        - "Send a message to +[number] saying [content]" (direct message to an explicit phone number, NOT a contact name)
        - "Remove my [upcoming/most recent] reminder" (reminder removal, alt phrasing)
        Do NOT choose MTT for general reminders, holiday countdowns, distance queries using "how far am I", or message searches.
      adapter_name: MTT-v3-iter10
      adapter_path: /home/ubuntu/hangook/games/tsb_lora/MTT-v3-10it-lora
      llm_args:
        api_base: http://localhost:8080/v1
        api_key: EMPTY

    - name: base
      description: >
        Choose base ONLY when the user message matches one of these specific patterns:
        - "Add a [reminder/todo] [content] [time] at [location]" (reminder that includes BOTH a time AND a physical location/store name like "Whole Foods")
        - "Ask [person name] [message]" (sending a message to a contact by NAME, not by phone number, informal phrasing)
        - "Where's [place]" followed by distance/recovery questions (vague location query that leads to multi-step conversation)
        Do NOT choose base for simple reminders, phone lookups, settings fixes, or direct phone number messages.
      model: Qwen/Qwen3-30B-A3B-Instruct-2507
      llm_args:
        api_base: http://localhost:8080/v1
        api_key: EMPTY
