# Multi-Model Serving — Single Skill Per Turn — retail
domain: retail
agent: orchestrator_agent
agent_llm: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

agent_llm_args:
  temperature: 0.0
  max_context_length: 32000

orchestrator:
  orchestrator_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
  orchestrator_llm_args:
    temperature: 0.0
    api_base: http://localhost:9070/v1
    api_key: EMPTY

  default_mode: single
  routing_context_window: 10

  skills:
    - name: tool_calling
      description: >
        Expert at making correct tool calls with proper arguments.
        Best for tasks requiring precise API interactions like cancellations,
        modifications, returns, exchanges, and data lookups.
      model: openai/tarsur909/Qwen3-30B-A3B-Instruct-2507-structured-tool-10
      llm_args:
        api_base: http://localhost:8070/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

    - name: policy_compliance
      description: >
        Expert at following domain policies precisely. Best for tasks
        requiring policy-gated decisions like refund eligibility,
        exchange rules, cancellation restrictions, and escalation criteria.
      model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
      llm_args:
        api_base: http://localhost:9070/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

    - name: data_reasoning
      description: >
        Expert at structured data reasoning — selecting correct items,
        variants, flights, and payment methods from complex data structures.
        Best for tasks with multiple similar options requiring disambiguation.
      model: openai/tarsur909/Qwen3-30B-A3B-Instruct-2507-structured-tool-10
      llm_args:
        api_base: http://localhost:8070/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

user_llm: vllm://Qwen/Qwen3-30B-A3B-Instruct-2507
user_llm_args:
  temperature: 0.0
  max_context_length: 32000

max_steps: 50
max_concurrency: 1
num_tasks: 5
num_trials: 1
seed: 42
verbose: true
save_to: multi-model-retail-test

vllm:
  base_url: http://localhost:9070/v1
