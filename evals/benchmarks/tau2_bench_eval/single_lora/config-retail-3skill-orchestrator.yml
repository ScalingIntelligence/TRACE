# Retail — 3-skill (base + TC + PRE)
domain: retail
agent: orchestrator_agent
agent_llm: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

agent_llm_args:
  temperature: 0.0
  max_context_length: 32000

orchestrator:
  orchestrator_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
  orchestrator_llm_args:
    temperature: 0.0
    api_base: http://localhost:9000/v1
    api_key: EMPTY

  routing_strategy: per_conversation
  routing_mode: classifier
  routing_topk: null
  classifier_temperature: 1.0
  is_weighted: true
  routing_topp: 0.8
  routing_context_window: 10

  skills:
    - name: general_service
      description: >
        Default skill with no specialized training. Use for
        off-topic conversations, tracking inquiries, emotional
        support, and hostile or demanding customers. Use when no
        order action is needed.
      model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
      llm_args:
        api_base: http://localhost:9000/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

    - name: tool_calling
      description: >
        Trained to execute tool calls with correct arguments for
        customer service actions. Default skill for order
        cancellations, item returns, simple single-item exchanges,
        address updates, payment changes, order lookups, and
        account modifications. Use for any direct action or
        information lookup. When in doubt, use this skill.
      adapter_name: toolcalling-grpo-iter40
      adapter_path: /home/ubuntu/.cache/huggingface/tau_tool_calling/grpo_ckpt_iter_40_20260311_030533
      llm_args:
        api_base: http://localhost:9000/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

    - name: precondition
      description: >
        Trained to check policy rules and correctly allow or refuse
        actions. Use for frustrated, stressed, or disappointed
        customers with product complaints, for verifying product
        specifications or capabilities, and when the outcome
        depends on policy rules — such as whether an alternate
        payment method can cover a price difference during an
        exchange, or when the customer is exchanging multiple
        items at once.
      adapter_name: precondition-grpo-iter40
      adapter_path: /home/ubuntu/.cache/huggingface/precondition/grpo_ckpt_iter_40_20260319_035848
      llm_args:
        api_base: http://localhost:9000/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

user_llm: vllm://Qwen/Qwen3-30B-A3B-Instruct-2507
user_llm_args:
  temperature: 0.0
  max_context_length: 32000
  tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

user: null
max_steps: 50
max_concurrency: 1
num_trials: 1
seed: 42
verbose: true

save_to: single_lora/results/retail-3skill-topp08

vllm:
  base_url: http://localhost:8090/v1
