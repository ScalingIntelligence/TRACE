# Retail — 5-skill RAC (Retrieval-Augmented Classification) routing
#
# Uses embedding retrieval + classifier to route to skill LoRAs.
# Weight-merge mode: server runs WITHOUT --enable-lora.
#
# Usage:
#   python main.py --config single_lora/config-retail-5skill-rac.yml

domain: retail
agent: orchestrator_agent
agent_llm: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

agent_llm_args:
  temperature: 0.0
  max_context_length: 32000

orchestrator:
  orchestrator_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
  orchestrator_llm_args:
    temperature: 0.0
    api_base: http://localhost:9001/v1
    api_key: EMPTY

  routing_strategy: per_conversation
  routing_mode: rac
  routing_topk: 1
  classifier_temperature: 1.0
  routing_context_window: 10

  # RAC config
  rac_corpus_path: /home/ubuntu/hangook/games/evals/benchmarks/tau2_bench_eval/gold_trajectories_retail.json
  rac_topk: 5
  rac_threshold: 0.5
  embedding_model: Qwen/Qwen3-Embedding-8B
  embedding_gpu: cuda:6

  skills:
    - name: general_service
      description: >
        Default skill with no specialized training. Use for
        off-topic conversations, tracking inquiries, emotional
        support, and hostile or demanding customers. Use when no
        order action is needed.
      model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
      llm_args:
        api_base: http://localhost:9000/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

    - name: tool_calling
      description: >
        Trained to execute tool calls with correct arguments for
        customer service actions. Default skill for order
        cancellations, item returns, simple single-item exchanges,
        address updates, payment changes, order lookups, and
        account modifications. Use for any direct action or
        information lookup. When in doubt, use this skill.
      adapter_name: toolcalling-grpo-iter40
      adapter_path: /home/ubuntu/.cache/huggingface/tau_tool_calling/grpo_ckpt_iter_40_20260311_030533
      llm_args:
        api_base: http://localhost:9000/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

    - name: precondition
      description: >
        Trained to check policy rules and correctly allow or refuse
        actions. Use for frustrated, stressed, or disappointed
        customers with product complaints, for verifying product
        specifications or capabilities, and when the outcome
        depends on policy rules — such as whether an alternate
        payment method can cover a price difference during an
        exchange, or when the customer is exchanging multiple
        items at once.
      adapter_name: precondition-grpo-iter40
      adapter_path: /home/ubuntu/.cache/huggingface/precondition/grpo_ckpt_iter_40_20260319_035848
      llm_args:
        api_base: http://localhost:9000/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

    - name: structured_data_reasoning
      description: >
        Trained to select the correct entity from structured data
        and compute derived values. Use when the customer needs
        to compare items by price or attributes to determine which
        one to return, exchange, or keep.
      adapter_name: structured-grpo-iter40
      adapter_path: /home/ubuntu/.cache/huggingface/structured_data_reasoning/grpo_ckpt_iter_40_20260308_080312
      llm_args:
        api_base: http://localhost:9000/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

    - name: multistep_task
      description: >
        Trained to complete a long sequence of operations without
        dropping any. Use only when the customer explicitly
        enumerates at least six separate tasks across different
        orders in one request.
      adapter_name: multistep-grpo-iter10
      adapter_path: /home/ubuntu/.cache/huggingface/multistep_task/grpo_ckpt_iter_10_20260318_110546
      llm_args:
        api_base: http://localhost:9000/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

# User simulator
user_llm: vllm://Qwen/Qwen3-30B-A3B-Instruct-2507
user_llm_args:
  temperature: 0.0
  max_context_length: 32000
  tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

user: null

max_steps: 50
max_concurrency: 1
num_trials: 1
seed: 42
verbose: true

save_to: retail-5skill-rac

vllm:
  base_url: http://localhost:9000/v1
  agent_base_urls:
    - http://localhost:9000/v1
  user_base_urls:
    - http://localhost:9001/v1
