# Airline — 5-skill Weighted LoRA (base + TC + STD + MT + PRE)
#
# Descriptions grounded in game training objectives, not instance patterns.
# Port 9002: base model for classifier + user sim
# Port 9002: base + LoRA adapters for actual inference
#
# Usage:
#   python main.py --config single_lora/config-airline-5skill-orchestrator.yml

domain: airline
agent: orchestrator_agent
agent_llm: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

agent_llm_args:
  temperature: 0.0
  max_context_length: 32000

orchestrator:
  orchestrator_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
  orchestrator_llm_args:
    temperature: 0.0
    api_base: http://localhost:9002/v1
    api_key: EMPTY

  routing_strategy: per_conversation
  routing_mode: classifier
  routing_topk: 1
  routing_context_window: 10

  skills:
    - name: general_service
      description: >
        No specialized training. General inquiries only.
      model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
      llm_args:
        api_base: http://localhost:9002/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

    - name: tool_calling
      description: >
        Single-action execution. Use when the customer states
        a clear action: book a flight, cancel a reservation,
        process a refund, update baggage, change a passenger
        name, or modify payment.
      adapter_name: toolcalling-grpo-iter40
      adapter_path: /home/ubuntu/.cache/huggingface/tau_tool_calling/grpo_ckpt_iter_40_20260311_030533
      llm_args:
        api_base: http://localhost:9002/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

    - name: structured_data_reasoning
      description: >
        Data comparison and selection. Use when the task requires
        choosing among multiple options or computing a value:
        cheapest flight, nonstop alternative, cabin class upgrade
        or downgrade cost, baggage allowance, flight delay status,
        or deciding which of several bookings to act on.
      adapter_name: structured-grpo-iter40
      adapter_path: /home/ubuntu/.cache/huggingface/structured_data_reasoning/grpo_ckpt_iter_40_20260308_080312
      llm_args:
        api_base: http://localhost:9002/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

    - name: multistep_task
      description: >
        Multiple write operations. Use ONLY when the customer
        lists five or more independent tasks in one request.
      adapter_name: multistep-grpo-iter10
      adapter_path: /home/ubuntu/.cache/huggingface/multistep_task/grpo_ckpt_iter_10_20260318_110546
      llm_args:
        api_base: http://localhost:9002/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

    - name: precondition
      description: >
        Policy rule enforcement. Use when the action may need
        to be refused: fare class modification restrictions,
        refund eligibility from insurance or booking timing,
        prior agent commitment verification, or booking
        replication feasibility.
      adapter_name: precondition-grpo-iter40
      adapter_path: /home/ubuntu/.cache/huggingface/precondition/grpo_ckpt_iter_40_20260319_035848
      llm_args:
        api_base: http://localhost:9002/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

# User simulator
user_llm: vllm://Qwen/Qwen3-30B-A3B-Instruct-2507
user_llm_args:
  temperature: 0.0
  max_context_length: 32000
  tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

user: null

max_steps: 50
max_concurrency: 1
num_trials: 1
seed: 42
verbose: true

save_to: ../../single_lora/results/airline-5skill-orchestrator-rerun

vllm:
  base_url: http://localhost:9002/v1