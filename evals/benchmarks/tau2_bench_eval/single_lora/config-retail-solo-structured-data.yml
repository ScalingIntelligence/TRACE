# Retail — Solo structured_data_reasoning LoRA (iter40)
#
# Runs structured_data_reasoning adapter alone on all 114 tasks.
#
# Usage:
#   python main.py --config single_lora/config-retail-solo-structured-data.yml

domain: retail
agent: orchestrator_agent
agent_llm: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

agent_llm_args:
  temperature: 0.0
  max_context_length: 32000

orchestrator:
  orchestrator_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
  orchestrator_llm_args:
    temperature: 0.0
    api_base: http://localhost:5050/v1
    api_key: EMPTY

  routing_strategy: per_conversation
  routing_mode: classifier
  routing_topk: 1
  routing_context_window: 10

  skills:
    - name: structured_data_reasoning
      description: >
        Handle all retail customer service requests.
      adapter_name: structured-grpo-iter40
      adapter_path: /home/ubuntu/.cache/huggingface/structured_data_reasoning/grpo_ckpt_iter_40_20260308_080312
      llm_args:
        api_base: http://localhost:5050/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

# User simulator
user_llm: vllm://Qwen/Qwen3-30B-A3B-Instruct-2507
user_llm_args:
  temperature: 0.0
  max_context_length: 32000
  tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

user: null

max_steps: 50
max_concurrency: 1
num_trials: 1
seed: 42
verbose: true

save_to: single_lora/results/retail-solo-structured-data

vllm:
  base_url: http://localhost:5050/v1
