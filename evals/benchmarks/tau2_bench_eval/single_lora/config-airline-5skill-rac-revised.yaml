# Airline — 4-skill RAC (Retrieval-Augmented Classification) routing
#
# Drops general_service (no unique solves in union).
# Descriptions aligned to game environment mechanics, not instance patterns.
#
# Usage:
#   python main.py --config single_lora/config-airline-5skill-rac-revised.yaml

domain: airline
agent: orchestrator_agent
agent_llm: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

agent_llm_args:
  temperature: 0.0
  max_context_length: 32000

orchestrator:
  orchestrator_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
  orchestrator_llm_args:
    temperature: 0.0
    api_base: http://localhost:9000/v1
    api_key: EMPTY

  routing_strategy: per_conversation
  routing_mode: rac
  routing_topk: 1
  classifier_temperature: 1.0
  routing_context_window: 10

  # RAC config
  rac_corpus_path: /home/ubuntu/hangook/games/evals/benchmarks/tau2_bench_eval/gold_trajectories_airline_revised.json
  rac_topk: 5
  rac_threshold: 0.5
  embedding_model: Qwen/Qwen3-Embedding-8B
  embedding_gpu: cuda:6

  skills:
    - name: tool_calling
      description: >
        Domain: airline customer service. The agent executes single,
        well-specified actions with exact argument values. Handles:
        add or remove passengers, change passenger names, add checked
        baggage, modify payment, book flights, or select the cheapest
        flight on a given date. Also handles conditional if-then-else
        fallback logic.
      adapter_name: toolcalling-grpo-iter40
      adapter_path: /home/ubuntu/.cache/huggingface/tau_tool_calling/grpo_ckpt_iter_40_20260311_030533
      llm_args:
        api_base: http://localhost:8080/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

    - name: structured_data_reasoning
      description: >
        Domain: airline data analysis and status resolution. The agent
        checks flight delay or cancellation status and determines
        resolution options. Also handles: calculating baggage limits
        from membership tier tables, comparing attributes across
        multiple reservations, and determining compensation amounts
        based on flight disruption data.
      adapter_name: structured-grpo-iter40
      adapter_path: /home/ubuntu/.cache/huggingface/structured_data_reasoning/grpo_ckpt_iter_40_20260308_080312
      llm_args:
        api_base: http://localhost:8080/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

    - name: precondition
      description: >
        Domain: airline customer service with strict policy rules. The
        agent must check preconditions and REFUSE when policy forbids
        the action. Handles: verifying whether requested modifications
        such as adding baggage, changing passengers, or changing cabin
        class are permitted under fare rules; cancellation eligibility
        based on ticket type and timing; basic economy modification
        restrictions; compassionate or emergency change requests; and
        compensation eligibility based on membership tier and flight
        disruption status.
      adapter_name: precondition-grpo-iter40
      adapter_path: /home/ubuntu/.cache/huggingface/precondition/grpo_ckpt_iter_40_20260319_035848
      llm_args:
        api_base: http://localhost:8080/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

    - name: multistep_task
      description: >
        Domain: airline and retail customer service. The agent executes
        multiple independent write operations in sequence across
        bookings — flight changes, cancellations, baggage updates,
        bookings, and passenger updates. Handles requests combining
        two or more separate actions such as canceling some reservations
        while modifying others.
      adapter_name: multistep-grpo-iter10
      adapter_path: /home/ubuntu/.cache/huggingface/multistep_task/grpo_ckpt_iter_10_20260318_110546
      llm_args:
        api_base: http://localhost:8080/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

# User simulator
user_llm: vllm://Qwen/Qwen3-30B-A3B-Instruct-2507
user_llm_args:
  temperature: 0.0
  max_context_length: 32000
  tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

user: null

task_ids:
  - "0"
  - "1"
  - "3"
  - "4"
  - "5"
  - "6"
  - "10"
  - "11"
  - "12"
  - "13"
  - "16"
  - "17"
  - "28"
  - "30"
  - "34"
  - "36"
  - "38"
  - "40"
  - "43"
  - "45"
  - "46"
  - "48"

max_steps: 50
max_concurrency: 1
num_trials: 1
seed: 42
verbose: true

save_to: airline-5skill-rac-revised

vllm:
  base_url: http://localhost:8080/v1
  agent_base_urls:
    - http://localhost:8080/v1
  user_base_urls:
    - http://localhost:9000/v1
