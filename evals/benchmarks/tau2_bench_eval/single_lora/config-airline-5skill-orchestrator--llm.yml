# Airline — 5-skill LLM-Multi Router with Weighted LoRA
#
# Uses LLM chain-of-thought to predict multiple relevant skills,
# then blends their LoRA adapters via weighted merge.
# Descriptions grounded in game training objectives, not instance patterns.
#
# Usage:
#   python main.py --config single_lora/config-airline-5skill-orchestrator--llm.yml

domain: airline
agent: orchestrator_agent
agent_llm: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

agent_llm_args:
  temperature: 0.0
  max_context_length: 32000

orchestrator:
  orchestrator_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
  orchestrator_llm_args:
    temperature: 0.0
    api_base: http://localhost:9002/v1
    api_key: EMPTY

  routing_strategy: per_conversation
  routing_mode: llm_multi
  routing_topk: null
  routing_context_window: 10
  is_weighted: false

  skills:
    - name: general_service
      description: >
        No specialized training. General inquiries only.
      model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
      llm_args:
        api_base: http://localhost:9002/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

    - name: tool_calling
      description: >
        Trained on single-action tasks where the customer
        explicitly states what to do. Strongest at constructing
        the correct API call for booking flights, processing
        cancellations and refunds, baggage updates, passenger
        changes, or payment modifications.
      adapter_name: toolcalling-grpo-iter40
      adapter_path: /home/ubuntu/.cache/huggingface/tau_tool_calling/grpo_ckpt_iter_40_20260311_030533
      llm_args:
        api_base: http://localhost:9002/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

    - name: structured_data_reasoning
      description: >
        Trained on tasks requiring selection from structured
        data and computing derived values. Strongest at picking
        the cheapest flight from search results, finding nonstop
        alternatives, computing cabin class upgrade or downgrade
        costs, looking up baggage allowances, checking flight
        delay status, or identifying which booking to act on
        among multiple similar records.
      adapter_name: structured-grpo-iter40
      adapter_path: /home/ubuntu/.cache/huggingface/structured_data_reasoning/grpo_ckpt_iter_40_20260308_080312
      llm_args:
        api_base: http://localhost:9002/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

    - name: multistep_task
      description: >
        Trained on completing a long sequence of back-to-back
        write operations without dropping any. Use ONLY when
        the customer lists five or more independent tasks in
        one request.
      adapter_name: multistep-grpo-iter10
      adapter_path: /home/ubuntu/.cache/huggingface/multistep_task/grpo_ckpt_iter_10_20260318_110546
      llm_args:
        api_base: http://localhost:9002/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

    - name: precondition
      description: >
        Trained on policy verification where the correct outcome
        may be refusing the customer's request. Strongest when
        the agent must deny or limit an action — fare class
        restrictions on modifications, refund eligibility based
        on insurance or booking timing, verifying prior agent
        commitments, or booking replication feasibility.
      adapter_name: precondition-grpo-iter40
      adapter_path: /home/ubuntu/.cache/huggingface/precondition/grpo_ckpt_iter_40_20260319_035848
      llm_args:
        api_base: http://localhost:9002/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

# User simulator
user_llm: vllm://Qwen/Qwen3-30B-A3B-Instruct-2507
user_llm_args:
  temperature: 0.0
  max_context_length: 32000
  tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

user: null

max_steps: 50
max_concurrency: 1
num_trials: 1
seed: 42
verbose: true

task_ids: [43,44,45,46,47,48,49]

save_to: ../../single_lora/results/airline-llm-multi-v5-43-49

vllm:
  base_url: http://localhost:9002/v1
