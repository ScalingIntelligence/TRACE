# Orchestrator + Skill LLMs — Mode 1: Separate Servers
#
# Each skill LLM is served on its own vLLM endpoint.
# The orchestrator LLM routes each turn to the most appropriate skill.
#
# Usage:
#   python main.py --config config-orchestrator-separate.yml

domain: retail
agent: orchestrator_agent
agent_llm: openai/Qwen3-30B-A3B-Instruct-2507

agent_llm_args:
  temperature: 0.0
  max_context_length: 32000

# Orchestrator configuration
orchestrator:
  # Model used for routing decisions (can be lightweight)
  orchestrator_model: openai/Qwen3-30B-A3B-Instruct-2507
  orchestrator_llm_args:
    temperature: 0.0
    api_base: http://localhost:8080/v1
    api_key: EMPTY

  # "single" = pick one skill per turn; "multi" = query multiple + synthesize
  default_mode: single

  # Number of recent messages to include in routing context
  routing_context_window: 10

  # Uncomment to bypass routing and always use a specific skill (for ablation):
  # skip_routing: tool_calling

  skills:
    - name: tool_calling
      description: >
        Expert at making correct tool calls with proper arguments.
        Best for tasks requiring precise API interactions like cancellations,
        modifications, returns, exchanges, and data lookups.
      model: openai/Qwen3-30B-tool-calling-adapter
      llm_args:
        api_base: http://localhost:8090/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

    - name: policy_compliance
      description: >
        Expert at following domain policies precisely. Best for tasks
        requiring policy-gated decisions like refund eligibility,
        exchange rules, cancellation restrictions, and escalation criteria.
      model: openai/Qwen3-30B-policy-adapter
      llm_args:
        api_base: http://localhost:8091/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

    - name: data_reasoning
      description: >
        Expert at structured data reasoning — selecting correct items,
        variants, flights, and payment methods from complex data structures.
        Best for tasks with multiple similar options requiring disambiguation.
      model: openai/Qwen3-30B-sdr-adapter
      llm_args:
        api_base: http://localhost:8092/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

# User simulator
user_llm: vllm://Qwen/Qwen3-30B-A3B-Instruct-2507
user_llm_args:
  temperature: 0.0
  max_context_length: 32000

# Execution
max_steps: 50
max_concurrency: 1
seed: 42

# vLLM server config for user simulator
vllm:
  user_base_urls:
    - http://localhost:9000/v1
