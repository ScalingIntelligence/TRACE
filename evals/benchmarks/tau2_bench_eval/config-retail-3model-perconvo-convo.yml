# Retail — 3-Model Per-Conversation Routing (LLM / Conversational)
#
# Routes once at the start of each conversation using LLM JSON output.
#
# Port 8060: Multistep model (multistep_workflow)
# Port 8080: Specialized model (tool_calling)
# Port 9000: Base model (policy_guard + general_purpose + orchestrator + user sim)
#
# Usage:
#   python main.py --config config-retail-3model-perconvo-convo.yml

domain: retail
agent: orchestrator_agent
agent_llm: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

agent_llm_args:
  temperature: 0.0
  max_context_length: 32000

# Orchestrator configuration
orchestrator:
  orchestrator_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
  orchestrator_llm_args:
    temperature: 0.0
    api_base: http://localhost:9000/v1
    api_key: EMPTY

  routing_strategy: per_conversation

  routing_context_window: 10

  skills:
    - name: tool_calling
      description: >
        DEFAULT skill. Use for ALL customer service work unless another skill
        explicitly matches. This includes: lookups, modifications, returns,
        exchanges, cancellations, product comparisons, price calculations,
        scanning multiple orders, recovering from wrong IDs or zip codes,
        conditional chains ("if can't X, try Y, else cancel"), returning or
        exchanging multiple items, and operations spanning multiple orders.
        The ONLY exceptions are: (1) the user wants to change a delivery
        ADDRESS and also modify/exchange items — use multistep_workflow;
        (2) the user received duplicate items and wants to return one based
        on price comparison — use multistep_workflow; (3) the user is
        hostile, emotionally distressed, provides email, or mentions
        broken/damaged items — use policy_guard; (4) the user ordered
        MULTIPLE COPIES of the same product and wants to exchange each
        copy to a different specification — use policy_guard. Note:
        exchanging a SINGLE item for a different version is tool_calling,
        not policy_guard.
      model: openai/tarsur909/Qwen3-30B-A3B-Instruct-2507-structured-tool-10
      llm_args:
        api_base: http://localhost:8080/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

    - name: multistep_workflow
      description: >
        Use ONLY for these two specific patterns: (1) The user explicitly
        wants to change the DELIVERY ADDRESS of an order AND also modify or
        exchange items in that order. (2) The user received duplicate or
        near-identical items and wants to return one based on which is more
        or less expensive (price comparison of duplicates). Do NOT use for
        single-product returns, single-product exchanges, cancellations,
        conditional chains, or operations across multiple orders. Do NOT
        use when the user ordered multiple copies of the same product and
        wants each exchanged to different specs (use policy_guard). When
        in doubt, use tool_calling.
      model: openai/tarsur909/Qwen3-30B-A3B-Instruct-2507-multistep-task-10
      llm_args:
        api_base: http://localhost:8060/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

    - name: policy_guard
      description: >
        Use when the user is openly hostile, insulting, or contemptuous (not
        merely impatient — "hurry up" is impatient, not hostile). Also use
        when the user expresses emotional distress or shares personal
        feelings, identifies themselves by email address, mentions broken
        or damaged items, or ordered MULTIPLE COPIES of the same product
        and wants to exchange each copy to a different specification.
        Note: exchanging a SINGLE item for a different version is NOT
        policy_guard. This model handles adversarial interactions and
        complex multi-copy exchanges with conversational flexibility.
      model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
      llm_args:
        api_base: http://localhost:9000/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

    - name: general_purpose
      description: >
        For initial greetings and brief acknowledgments only. Do NOT use
        once the user has stated their request or any order, product, or
        account information has been discussed.
      model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
      llm_args:
        api_base: http://localhost:9000/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

# User simulator
user_llm: vllm://Qwen/Qwen3-30B-A3B-Instruct-2507
user_llm_args:
  temperature: 0.0
  max_context_length: 32000

# Execution
max_steps: 50
max_concurrency: 1
num_trials: 1
seed: 42
verbose: true

save_to: retail-3model-pc-convo-v7-subset

# vLLM server config for user simulator
vllm:
  base_url: http://localhost:9000/v1
