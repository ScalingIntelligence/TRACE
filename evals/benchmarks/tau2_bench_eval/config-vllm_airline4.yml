# τ²-bench Evaluation with Mixed Model Configuration
# This configuration supports different models for agent and user simulator
# Example: vLLM local model for agent + OpenAI API for user simulator

# Domain Configuration
domain: airline                                                          # Domain to evaluate

# Agent Configuration (4B model)
# Use vllm:// prefix to indicate vLLM model
agent_llm: vllm://Qwen/Qwen3-30B-A3B-Instruct-2507
agent: null

# LoRA Adapter Configuration (optional)
# If specified, loads this adapter and uses it instead of base model
lora_adapter_path: /root/workplace/games/outputs/grpo_ckpt_iter_20_20260213_222635
lora_adapter_name: adv_iter_20

# Agent LLM Arguments
agent_llm_args:
  temperature: 0.0
  max_context_length: 32000                                             # Truncate if context exceeds this
  tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507             # Base model tokenizer for LoRA adapter

# User Simulator Configuration (30B model)
user_llm: vllm://Qwen/Qwen3-30B-A3B-Instruct-2507
user_llm_args:
  temperature: 0.0                                                      # Temperature 0 for reproducibility
  max_context_length: 32000                                             # Truncate if context exceeds this

user: null

# Task Configuration
# num_trials: 1                                                            # Single trial per task
# num_tasks: 7                                                            # Run only 7 tasks for quick test
# task_ids: [18, 21, 31, 45, 48, 57, 58]


max_steps: 50
max_concurrency: 1
seed: 42

# Output Configuration
output_dir: outputs
save_to: qwen-3-30b-adv_iter_20-airline-qwen3-30b

# Advanced Options
verbose: true                                                            # Enable verbose output

# vLLM Configuration - Separate server pools for agent and user
vllm:
  api_key: null                                                          # No API key needed for local
  # Agent servers (4B model) - ports 8090, 8091
  agent_base_urls:
    - http://localhost:8082/v1
  # User servers (30B model) - ports 9000, 9001
  user_base_urls:
    - http://localhost:8082/v1

# Run evaluation:
#   python main.py --config config-vllm.yml