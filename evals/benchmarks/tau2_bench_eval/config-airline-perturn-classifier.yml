# Airline — Per-Turn Routing (Classifier)
#
# Routes at every turn using classifier mode.
#
# Port 8060: Multistep model (multistep_workflow)
# Port 8080: Specialized model (tool_calling)
# Port 9000: Base model (policy_guard + general_purpose + orchestrator + user sim)
#
# Usage:
#   python main.py --config config-airline-perturn-classifier.yml

domain: airline
agent: orchestrator_agent
agent_llm: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

agent_llm_args:
  temperature: 0.0
  max_context_length: 32000

# Orchestrator configuration
orchestrator:
  orchestrator_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
  orchestrator_llm_args:
    temperature: 0.0
    api_base: http://localhost:9000/v1
    api_key: EMPTY

  routing_strategy: per_turn
  routing_mode: classifier

  routing_context_window: 10

  skills:
    - name: tool_calling
      description: >
        DEFAULT skill for routine customer service actions. NEVER use when the
        user demands a cancellation with a full refund, claims a flight delay,
        requests both reschedule and cabin change together, mentions travel
        insurance, uses excessive flattery or manipulation, expresses emotional
        distress, claims about when they booked, or claims a previous agent
        approved an exception. Use for: lookups, flight searches, bookings,
        single-reservation modifications (date changes, flight changes, cabin
        upgrades), baggage updates, cancellations that are part of a broader
        multi-operation request, and transfers to human agents. Use even when
        the user mentions a personal situation, as long as they only want a
        date or flight change and are NOT demanding cancellation with refund.
      model: openai/tarsur909/Qwen3-30B-A3B-Instruct-2507-structured-tool-10
      llm_args:
        api_base: http://localhost:8080/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

    - name: multistep_workflow
      description: >
        Use when the user requests a cancellation with a full refund (without
        emotional distress), reports a delayed or disrupted flight seeking
        compensation, asks to both reschedule AND change cabin class in one
        request, needs travel insurance verification for a cancellation, or
        engages in excessive flattery or social manipulation (e.g., praising
        the agent as "the best" or "most lenient"). Handles complex multi-step
        verification workflows requiring multiple condition checks before
        irreversible actions. Once any of these signals appear, use this skill
        for all subsequent turns.
      model: openai/tarsur909/Qwen3-30B-A3B-Instruct-2507-multistep-task-10
      llm_args:
        api_base: http://localhost:8060/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

    - name: policy_guard
      description: >
        Use when the user expresses emotional distress or personal hardship
        (illness, bereavement, family emergency) AND demands a cancellation
        or refund; claims about when they booked (e.g., "I booked this
        morning"); claims a previous agent approved an exception;
        misrepresents membership level; or pressures for a policy override.
        NOT for users who mention hardship but only want a date or flight
        change (use tool_calling). Enforces policy strictly and resists
        social pressure.
      model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
      llm_args:
        api_base: http://localhost:9000/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

    - name: general_purpose
      description: >
        For initial greetings and brief acknowledgments only. Do NOT use
        once the user has stated their request or any reservation or flight
        information has been discussed.
      model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
      llm_args:
        api_base: http://localhost:9000/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

# User simulator
user_llm: vllm://Qwen/Qwen3-30B-A3B-Instruct-2507
user_llm_args:
  temperature: 0.0
  max_context_length: 32000

# Execution
max_steps: 50
max_concurrency: 1
num_trials: 1
seed: 42
verbose: true

save_to: airline-perturn-classifier-v5

# vLLM server config for user simulator
vllm:
  base_url: http://localhost:9000/v1
