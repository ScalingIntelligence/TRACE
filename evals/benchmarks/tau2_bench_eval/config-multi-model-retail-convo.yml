# Multi-Model Serving — Single Skill Per Conversation — retail
domain: retail
agent: orchestrator_agent
agent_llm: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

agent_llm_args:
  temperature: 0.0
  max_context_length: 32000

orchestrator:
  orchestrator_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
  orchestrator_llm_args:
    temperature: 0.0
    api_base: http://localhost:9000/v1
    api_key: EMPTY

  routing_strategy: per_conversation
  routing_context_window: 10

  skills:
    - name: complex_specialist
      description: >
        CHECK THIS SKILL FIRST. Use when ANY of these triggers appear in the
        user's opening message:

        TRIGGER A — EXPLICITLY RUDE OR HOSTILE TONE: The user is openly
        rude, insulting, or hostile — not merely impatient or direct.
        The message must contain overtly dismissive or hostile phrases.
        Examples that MUST use this skill:
        "I don't have time for small talk... Get on it, don't waste my time."
        "Just fix this already, I don't want to repeat myself."
        Key signals: phrases like "don't waste my time", "get on it",
        "I don't have time for small talk", "hurry up", insults, or
        contemptuous language. NOTE: A user who simply skips "hello" and
        states their request directly is NOT rude — that is just a
        direct/urgent request and should use standard_agent. Examples of
        NOT rude (use standard_agent): "I need to return an air purifier
        and a vacuum cleaner. I want the refund as soon as possible —
        within three days." This is urgent but polite — no insults, no
        hostility, no contempt.

        TRIGGER B — MULTI-ITEM EXCHANGE WITH TECHNICAL SPECS: The user wants
        to exchange TWO or more DISTINCT items (or two of the same product
        across separate orders) and specifies technical details for the
        replacements. Examples that MUST use this skill:
        "I'd like to exchange the mechanical keyboard for one with clicky
        switches and RGB backlight... I also want to exchange the smart
        thermostat for one compatible with Google Home."
        "I want to exchange two laptops for models with i7 processors, 8GB
        RAM, and 1TB SSD."
        Key signals: exchanging (not returning) 2+ items with hardware specs
        like processor, RAM, storage, switch type, backlight, compatibility,
        or material. NOTE: This trigger is ONLY for EXCHANGES of 2+ items,
        NOT for returns. Returning multiple items does NOT qualify even with
        urgency or deadlines. A SINGLE item exchange with specs (e.g.,
        "exchange my camera for one with maximum zoom") also does NOT
        qualify — use standard_agent for all returns and for single-item
        exchanges regardless of how technical the specs are.

        TRIGGER C — EMOTIONAL OR PERSONAL SHARING: The user mentions personal
        feelings or life circumstances. Examples: "I'm in debt and feeling
        really down", "I've been feeling a bit lonely lately", "I'm having
        a terrible day". Key signal: emotional language about their life.

        TRIGGER D — EMAIL IDENTIFICATION: The user provides an email address
        (contains @) to identify themselves.

        IMPORTANT: These triggers apply even if the user ALSO provides their
        name and zip code. Name+zip does NOT override these triggers.
      model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
      llm_args:
        api_base: http://localhost:9000/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

    - name: standard_agent
      description: >
        Fallback skill — use when NONE of the complex_specialist triggers
        (A, B, C, D) match the user's opening message.

        Typical conversations for this skill: cancellations, simple
        inquiries, order modifications, single-item returns or exchanges
        (even with technical specs), status checks, price lookups, and
        conversations where the user is polite, neutral, or simply direct
        and urgent without being rude.

        Use this skill for direct/impatient users who are NOT rude — e.g.,
        "I need to return an air purifier and a vacuum cleaner. I want the
        refund as soon as possible — within three days" is direct/urgent
        but not hostile. Also use for ALL returns (even multi-item returns),
        and for single-item exchanges even with technical specs like
        "exchange my camera for one with maximum zoom."

        Note: "exchange" or "return" keywords do NOT automatically mean
        complex_specialist. Only route there when the specific triggers
        (hostile tone, multi-item specs, emotional content, or email) match.
      model: openai/tarsur909/Qwen3-30B-A3B-Instruct-2507-structured-tool-10
      llm_args:
        api_base: http://localhost:8080/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

    - name: general_purpose
      description: >
        ONLY for messages with zero order-related intent — purely off-topic
        (jokes, poems, trivia). Never use if the user mentions any order,
        product, return, exchange, cancellation, or account topic.
      model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
      llm_args:
        api_base: http://localhost:9000/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

user_llm: vllm://Qwen/Qwen3-30B-A3B-Instruct-2507
user_llm_args:
  temperature: 0.0
  max_context_length: 32000

max_steps: 50
max_concurrency: 1
num_trials: 1
seed: 42
verbose: true
save_to: multi-model-retail-convo-rerun

vllm:
  base_url: http://localhost:9000/v1
