# Retail — Per-Turn Routing (LLM / Conversational)
#
# Routes at every turn using LLM JSON output.
#
# Port 8080: Specialized model (tool_calling)
# Port 9000: Base model (policy_guard + general_purpose + orchestrator + user sim)
#
# Usage:
#   python main.py --config config-retail-perturn-convo.yml

domain: retail
agent: orchestrator_agent
agent_llm: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

agent_llm_args:
  temperature: 0.0
  max_context_length: 32000

# Orchestrator configuration
orchestrator:
  orchestrator_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
  orchestrator_llm_args:
    temperature: 0.0
    api_base: http://localhost:9000/v1
    api_key: EMPTY

  routing_strategy: per_turn

  routing_context_window: 10

  skills:
    - name: tool_calling
      description: >
        Expert at executing tool calls, presenting retrieved information, and
        completing multi-step workflows efficiently. Use for all turns that
        involve routine customer service work: looking up user or order details,
        searching for products, presenting options to the user, modifying
        pending orders (items, address, payment), and handling single-item
        returns or exchanges. This includes turns where the agent presents
        product variants or order details and asks the user to confirm. Use
        this skill even when the user is urgent, impatient, or direct — as
        long as they are not openly insulting or contemptuous. A user who says
        "I need this done fast," "hurry up with this," or "this is
        non-negotiable" is impatient, not hostile. Do NOT use this skill when
        the conversation history contains openly hostile or contemptuous
        language (insults, dismissive put-downs), emotional distress or
        personal sharing about their life, when the user identifies
        themselves via email address, or when the conversation involves
        exchanging or returning multiple items or performing actions across
        multiple orders.
      model: openai/tarsur909/Qwen3-30B-A3B-Instruct-2507-structured-tool-10
      llm_args:
        api_base: http://localhost:8080/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

    - name: policy_guard
      description: >
        Expert at policy enforcement, handling adversarial users, and executing
        complex or sensitive actions. Use this skill when the conversation
        history contains any of these signals: the user is openly hostile,
        insulting, or contemptuous (not merely impatient or direct — a user
        who says "this is non-negotiable" or sets a deadline is impatient,
        not hostile); the user expresses emotional distress or shares personal
        feelings about their life; the user identifies themselves by email
        address; or the conversation involves exchanging or returning multiple
        items or performing actions across multiple orders. Once any of these
        signals have appeared in the conversation, use this skill for ALL
        remaining turns in the conversation. This model carefully verifies
        all prerequisites and will correctly refuse requests that violate
        policy.
      model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
      llm_args:
        api_base: http://localhost:9000/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

    - name: general_purpose
      description: >
        For simple conversational responses only. Use exclusively for the
        initial greeting at the start of a conversation or for brief
        acknowledgments when no customer service action is needed. Do NOT use
        once the user has stated their request or any order, product, or
        account information has been discussed.
      model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
      llm_args:
        api_base: http://localhost:9000/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

# User simulator
user_llm: vllm://Qwen/Qwen3-30B-A3B-Instruct-2507
user_llm_args:
  temperature: 0.0
  max_context_length: 32000

# Execution
max_steps: 50
max_concurrency: 1
num_trials: 1
seed: 42
verbose: true

save_to: retail-perturn-convo

# vLLM server config for user simulator
vllm:
  base_url: http://localhost:9000/v1
