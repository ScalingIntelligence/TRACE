# Multi-Model Serving — Single Skill Per Turn
#
# Port 8080: Multistep model (complex_task_reasoning)
# Port 9090: Specialized model (tool_calling)
# Port 9092: Base model (policy_guard + general_purpose + orchestrator routing + user simulator)
#
# Usage:
#   python main.py --config config-multi-model-airline.yml

domain: airline
agent: orchestrator_agent
agent_llm: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

agent_llm_args:
  temperature: 0.0
  max_context_length: 32000

# Orchestrator configuration
orchestrator:
  # Routing LLM — use base model on port 9092
  orchestrator_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
  orchestrator_llm_args:
    temperature: 0.0
    api_base: http://localhost:9092/v1
    api_key: EMPTY

  # "per_turn" = route every turn, "per_conversation" = route once and reuse
  routing_strategy: per_turn

  # Number of recent messages to include in routing context
  routing_context_window: 10

  skills:
    - name: tool_calling
      description: >
        Expert at executing tool calls with correct arguments and completing
        multi-step workflows efficiently. Use for any turn requiring a tool call:
        booking flights, searching flights, cancelling reservations, modifying
        cabins or baggage, calculating prices, and transferring to human agents.
        Especially strong at complex workflows involving multiple reservations or
        combined operations (e.g., cancel one reservation + upgrade another +
        search for new flights in a single conversation). Also handles
        straightforward policy checks well (e.g., verifying cancellation criteria,
        checking insurance coverage rules). Do NOT use this skill when the user is
        actively pressuring the agent with emotional appeals, claiming a previous
        agent already approved an exception, lying about their membership level, or
        otherwise trying to get the agent to bypass policy through social pressure.
      model: openai/tarsur909/Qwen3-30B-A3B-Instruct-2507-structured-tool-10
      llm_args:
        api_base: http://localhost:9090/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

    - name: careful_tool_calling
      description: >
        Alternative tool-calling skill that is more cautious and thorough about
        policy enforcement before executing actions. Use this skill INSTEAD OF
        tool_calling (never combine both) when the turn requires executing or
        refusing a tool call AND the conversation shows one of these specific
        situations: (1) the user wants to cancel a reservation and has travel
        insurance, but the cancellation reason is personal (birthday, schedule
        conflict, change of mind) rather than health or weather — this skill
        will correctly refuse; (2) the user is asserting a fact about their
        reservation (like passenger count) that may be incorrect, and the agent
        needs to rely on database records rather than user claims before issuing
        compensation or making changes; (3) the user wants to change cabin class
        and the agent must ensure the price calculation covers ALL flight segments
        in the reservation, not just some, and must refuse if the user tries to
        pay less than the actual cost. This skill handles the complete turn
        including any needed tool calls — it does NOT need to be combined with
        tool_calling. Choose ONLY ONE of tool_calling or careful_tool_calling
        per turn, never both.
      model: openai/tarsur909/Qwen3-30B-A3B-Instruct-2507-multistep-task-10
      llm_args:
        api_base: http://localhost:8080/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

    - name: policy_guard
      description: >
        Expert at resisting social pressure and enforcing policy under adversarial
        conditions. Use this skill ONLY when the conversation context shows the
        user is actively trying to pressure the agent into bypassing policy —
        for example: claiming a previous representative or supervisor already
        approved an exception, lying about or misrepresenting their membership
        status or flight details, making urgent emotional appeals (family
        emergencies, personal hardship) to override cancellation or modification
        rules, or insisting that a prior commitment was made. This model is more
        conservative and will correctly refuse to take action under social
        engineering pressure rather than incorrectly proceeding.
      model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
      llm_args:
        api_base: http://localhost:9092/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

    - name: general_purpose
      description: >
        For conversational responses when no tool call is needed and no policy
        decision is being made. Use for greetings, acknowledging user input,
        summarizing information already retrieved, asking clarifying questions,
        and other routine messages that do not require API calls or policy
        reasoning.
      model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
      llm_args:
        api_base: http://localhost:9092/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

# User simulator — base model on port 9092
user_llm: vllm://Qwen/Qwen3-30B-A3B-Instruct-2507
user_llm_args:
  temperature: 0.0
  max_context_length: 32000

# Execution
max_steps: 50
max_concurrency: 1
num_trials: 1
seed: 42
verbose: true

save_to: 3-model-airline-test

# vLLM server config — base_url for agent_llm fallback + user simulator
vllm:
  base_url: http://localhost:9092/v1
