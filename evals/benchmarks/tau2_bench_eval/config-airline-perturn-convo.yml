# Airline — Per-Turn Routing (LLM / Conversational)
#
# Routes at every turn using LLM JSON output.
#
# Port 8080: Specialized model (tool_calling)
# Port 9000: Base model (policy_guard + general_purpose + orchestrator + user sim)
#
# Usage:
#   python main.py --config config-airline-perturn-convo.yml

domain: airline
agent: orchestrator_agent
agent_llm: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

agent_llm_args:
  temperature: 0.0
  max_context_length: 32000

# Orchestrator configuration
orchestrator:
  orchestrator_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
  orchestrator_llm_args:
    temperature: 0.0
    api_base: http://localhost:9000/v1
    api_key: EMPTY

  routing_strategy: per_turn

  routing_context_window: 10

  skills:
    - name: tool_calling
      description: >
        Expert at executing tool calls, presenting retrieved information, and
        completing multi-step workflows efficiently. Use for all turns that
        involve customer service work: looking up user or reservation details,
        searching for flights, presenting options to the user, executing
        bookings, cancellations, modifications, cabin changes, baggage
        updates, and transferring to human agents. This includes turns where
        the agent presents reservation details and asks the user to confirm
        before proceeding. Do NOT use this skill when the conversation history
        contains emotional language about personal suffering (e.g., illness,
        bereavement, family emergency) or when the user has made a specific
        claim about how recently they booked.
      model: openai/tarsur909/Qwen3-30B-A3B-Instruct-2507-structured-tool-10
      llm_args:
        api_base: http://localhost:8080/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

    - name: policy_guard
      description: >
        Expert at policy enforcement, fact-checking, and resisting social
        pressure. Use this skill when the conversation history contains any
        of these signals: emotional distress or personal hardship (illness,
        bereavement, family emergency, or any urgent personal situation),
        claims about when the user booked (e.g., "I booked this morning,"
        "I just booked it"), claims that a previous agent already approved
        an exception, misrepresentation of membership level, or any pressure
        for a policy override. This model carefully checks all policy
        prerequisites before taking action, and will correctly refuse when
        policy does not permit the change.
      model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
      llm_args:
        api_base: http://localhost:9000/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

    - name: general_purpose
      description: >
        For simple conversational responses only. Use exclusively for the
        initial greeting at the start of a conversation or for brief
        acknowledgments when no customer service action is needed. Do NOT use
        once the user has stated their request or any reservation, flight, or
        booking information has been discussed.
      model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
      llm_args:
        api_base: http://localhost:9000/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000

# User simulator
user_llm: vllm://Qwen/Qwen3-30B-A3B-Instruct-2507
user_llm_args:
  temperature: 0.0
  max_context_length: 32000

# Execution
max_steps: 50
max_concurrency: 1
num_trials: 1
seed: 42
verbose: true

save_to: airline-perturn-convo

# vLLM server config for user simulator
vllm:
  base_url: http://localhost:9000/v1
