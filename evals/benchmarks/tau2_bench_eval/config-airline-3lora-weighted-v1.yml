# Airline — 3-skill Weighted LoRA (base + STD + TC), top-1 per-conversation routing
#
# Skills grounded in training:
#   - structured_data_reasoning: fine-tuned on structured data reasoning tasks
#   - tool_calling: fine-tuned on multi-turn tool-calling conversations
#   - general_service: unspecialized base model
#
# Port 8080: vLLM with Qwen3-30B base + 2 LoRA adapters
#
# Usage:
#   python main.py --config config-airline-3lora-weighted-v1.yml

domain: airline
agent: orchestrator_agent
agent_llm: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

agent_llm_args:
  temperature: 0.0
  max_context_length: 32000

orchestrator:
  orchestrator_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
  orchestrator_llm_args:
    temperature: 0.0
    api_base: http://localhost:8080/v1
    api_key: EMPTY

  routing_strategy: per_conversation
  routing_mode: classifier
  routing_topk: 1
  routing_context_window: 10

  skills:
    - name: general_service
      description: >
        Unspecialized base model. Best at routine conversations and
        straightforward requests.
      model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
      llm_args:
        api_base: http://localhost:8080/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

    - name: structured_data_reasoning
      description: >
        Specializes in careful reasoning over structured records such as
        cabin class upgrades and downgrades, fare hierarchy evaluation,
        resolving ambiguous or conflicting bookings, and navigating
        emotionally charged policy decisions.
      adapter_name: structured-grpo-iter40
      adapter_path: /home/ubuntu/.cache/huggingface/structured_data_reasoning/grpo_ckpt_iter_40_20260308_080312
      llm_args:
        api_base: http://localhost:8080/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

    - name: tool_calling
      description: >
        Specializes in executing multi-step API call sequences for booking new flights, flight search and route/nonstop selection,
        insurance-based cancellations, compensation processing, and
        multi-reservation update workflows.
      adapter_name: tau-tool-calling-grpo-iter40
      adapter_path: /home/ubuntu/.cache/huggingface/tau_tool_calling/grpo_ckpt_iter_40_20260311_030533
      llm_args:
        api_base: http://localhost:8080/v1
        api_key: EMPTY
        temperature: 0.0
        max_context_length: 32000
        tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

# User simulator
user_llm: vllm://Qwen/Qwen3-30B-A3B-Instruct-2507
user_llm_args:
  temperature: 0.0
  max_context_length: 32000
  tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

user: null

max_steps: 50
max_concurrency: 1
num_trials: 1
seed: 42
verbose: true

task_ids: [1, 5, 9, 13, 18, 20, 37, 38, 43, 49]

save_to: airline-3lora-wt-v35

vllm:
  base_url: http://localhost:8080/v1
