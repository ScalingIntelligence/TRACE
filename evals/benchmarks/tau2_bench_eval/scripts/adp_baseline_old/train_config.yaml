### LLaMA-Factory training config for ADP baseline
### Matches our expert LoRA setup: r=16, alpha=16, same target modules

### Model
model_name_or_path: Qwen/Qwen3-30B-A3B-Instruct-2507
trust_remote_code: true

### Method — LoRA to match our expert adapter setup
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 16
lora_dropout: 0.0
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj

### Dataset
dataset_dir: /home/ubuntu/hangook/games/evals/benchmarks/tau2_bench_eval/scripts/adp_baseline
dataset: adp_sft
template: qwen3
cutoff_len: 32768
preprocessing_num_workers: 16
tokenized_path: /home/ubuntu/hangook/games/evals/benchmarks/tau2_bench_eval/scripts/adp_baseline/data/tokenized_cache

### Training hyperparameters
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### Logging
logging_steps: 10
save_steps: 500
save_total_limit: 3

### Output
output_dir: /home/ubuntu/.cache/huggingface/adp_baseline/sft_lora
overwrite_output_dir: true
report_to: wandb
run_name: adp-baseline-lora-r16
