# Base model + GEPA prompts — retail
#
# Runs the base Qwen3-30B model with concatenated GEPA best prompts.
#
# Usage:
#   python main.py --config config-gepa-retail.yml

domain: retail
agent_llm: vllm://Qwen/Qwen3-30B-A3B-Instruct-2507
agent: null

agent_llm_args:
  temperature: 0.0
  max_context_length: 32000
  tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

agent_prompt_files:
  - /home/ubuntu/hangook/games/outputs/gepa_ablation_oracle/tool_calling/best_prompt_at_2032.txt
  - /home/ubuntu/hangook/games/outputs/gepa_ablation_oracle/precondition/best_prompt_at_2010.txt
  - /home/ubuntu/hangook/games/outputs/gepa_ablation_oracle/multistep/best_prompt_at_2022.txt
  - /home/ubuntu/hangook/games/outputs/gepa_ablation_oracle/structured_data/best_prompt_at_2008.txt

user_llm: vllm://Qwen/Qwen3-30B-A3B-Instruct-2507
user_llm_args:
  temperature: 0.0
  max_context_length: 32000
  tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

user: null
num_trials: 1
max_steps: 50
max_concurrency: 1
seed: 42
verbose: true
save_to: gepa-retail-2000

vllm:
  base_url: http://localhost:8080/v1
