# Base model only — airline
#
# Runs the base Qwen3-30B model without orchestration.
#
# Usage:
#   python main.py --config config-base-airline.yml

domain: airline
agent_llm: vllm://Qwen/Qwen3-30B-A3B-Instruct-2507
agent: null

agent_llm_args:
  temperature: 0.0
  max_context_length: 32000
  tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

user_llm: vllm://Qwen/Qwen3-30B-A3B-Instruct-2507
user_llm_args:
  temperature: 0.0
  max_context_length: 32000
  tokenizer_model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507

user: null
num_trials: 1
max_steps: 50
max_concurrency: 1
seed: 42
verbose: true
save_to: base-airline-det

vllm:
  base_url: http://localhost:8080/v1
